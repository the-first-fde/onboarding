name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_sonar:
        description: '승인된 기존 Sonar 프로젝트로 분석을 전송합니다'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.8'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked
      - name: Install checksum-verified Gitleaks
        run: uv run --locked python scripts/install_tools.py
      - name: Shared verification (no Claude or MCP credentials)
        run: uv run --locked python scripts/verify.py
      - name: Sonar status and activation check
        id: sonar
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          RUN_SONAR: ${{ inputs.run_sonar }}
          SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
          EXTERNAL_ANALYSIS_APPROVED: ${{ vars.EXTERNAL_ANALYSIS_APPROVED }}
        run: |
          python - <<'PYTHON'
          import os
          requested = os.environ['RUN_SONAR'] == 'true'
          trusted = os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['REF_NAME'] == 'refs/heads/main'
          enabled = os.environ['SONAR_ENABLED'] == 'true'
          approved = os.environ['EXTERNAL_ANALYSIS_APPROVED'] == 'true'
          run = requested and trusted and enabled and approved
          if requested and not run:
              raise SystemExit('Sonar FAIL: main manual dispatch + enabled + external approval are required')
          status = 'READY for explicitly approved scan' if run else 'NOT RUN: disabled or not explicitly requested; no external analysis sent'
          print('Sonar: ' + status)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Sonar: ' + status + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('run=' + str(run).lower() + '\n')
          PYTHON
      - name: Check required Sonar configuration (names only)
        if: steps.sonar.outputs.run == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          python - <<'PYTHON'
          import os
          required = ['SONAR_TOKEN', 'SONAR_ORGANIZATION', 'SONAR_PROJECT_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Sonar FAIL: missing configuration names: ' + ', '.join(missing))
          print('Required Sonar configuration present; values hidden')
          PYTHON
      - name: Approved existing-project Sonar scan and Quality Gate
        if: steps.sonar.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
