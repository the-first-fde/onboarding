[project]
name = "hr-onboarding"
version = "0.1.0"
description = "The First HR onboarding bootstrap; business contracts deferred"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.24",
  "claude-agent-sdk==0.2.188",
  "mcp==2.3.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
]

[dependency-groups]
dev = [
  "ruff==0.17.6", "pytest==9.2.0", "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0", "pre-commit==4.7.0", "pyright==1.1.414",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_onboarding"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["third_party", ".venv", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"scripts/**" = ["S603", "S607"]
".claude/hooks/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["hr_onboarding"]
relative_files = true
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
