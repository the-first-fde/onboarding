[project]
name = "hr-operations"
version = "0.1.0"
description = "Independent HR operations: recruitment to onboarding"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.optional-dependencies]
# Optional, intentionally not installed/called by the mock runtime.
agent = ["claude-agent-sdk>=0.1,<1"]
rag = ["langchain-core>=1,<2", "langchain-postgres>=0.0.12,<1", "pgvector>=0.3,<1"]

[tool.pytest.ini_options]
# scripts/collaboration(GitHub → Notion 동기화)은 HR 런타임과 분리한 채 import한다.
pythonpath = ["apps/backend", "scripts"]
testpaths = ["tests"]
