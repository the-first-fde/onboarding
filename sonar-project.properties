# CI only; keys are supplied by approved Actions Variables.
sonar.host.url=https://sonarcloud.io
sonar.sources=src,scripts/collaboration
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# 기본 coverage 지표는 HR 런타임 기준이다. 협업 코드는 정적 분석만 하고 coverage 대상에서 뺀다.
sonar.coverage.exclusions=scripts/collaboration/**
sonar.exclusions=third_party/**,fixtures/**,docs/**,.claude/**,data/**,logs/**
